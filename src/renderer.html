<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MemGuard</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="card" id="card" title="双击立即清理">
    <div class="percent" id="percent">--%</div>
    <div class="meta">
      <div class="free" id="free">可用 -- GB</div>
      <div class="last" id="last">--</div>
    </div>
    <div class="bar">
      <div class="fill" id="fill"></div>
      <div class="shine"></div>
    </div>
    <button class="clean-button" id="cleanButton" type="button">清理</button>
  </main>
  <script src="./renderer.js"></script>
</body>
</html>
